<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deepak Arcade Hub - Casino & Action Games</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --accent-color: #f59e0b;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }

        [data-theme="light"] {
            --bg-color: #f1f5f9;
            --surface-color: #ffffff;
            --surface-hover: #e2e8f0;
            --accent-color: #d97706;
            --accent-gradient: linear-gradient(135deg, #d97706 0%, #dc2626 100%);
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .logo-icon {
            font-size: 2rem;
        }

        .logo-text h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-text p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .btn {
            background: var(--surface-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
        }

        .btn:hover {
            border-color: var(--accent-color);
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.2rem;
        }

        main {
            flex: 1;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            padding: 2rem;
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        .categories-filter {
            display: flex;
            gap: 0.5rem;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-bottom: 2rem;
            scrollbar-width: thin;
        }

        .category-chip {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: 500;
            font-size: 0.9rem;
        }

        .category-chip.active, .category-chip:hover {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .game-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
            text-decoration: none;
        }

        .game-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .game-info h3 {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            word-break: break-word;
        }

        .game-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .game-badge {
            font-size: 0.75rem;
            background-color: var(--surface-hover);
            color: var(--text-secondary);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .fav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0.25rem;
        }

        .fav-btn.active {
            color: #f43f5e;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem;
            color: var(--text-secondary);
            font-size: 1.2rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
            background-color: var(--surface-color);
            margin-top: auto;
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }
            .search-container {
                max-width: 100%;
            }
        }
    </style>
</head>
<body data-theme="dark">

    <header>
        <div class="logo-area">
            <span class="logo-icon">🎰</span>
            <div class="logo-text">
                <h1>Deepak Arcade</h1>
                <p>Slots, Table & Arcade Games Hub</p>
            </div>
        </div>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="Search games...">
        </div>
        <div class="header-actions">
            <button class="btn" id="favFilterBtn">⭐ Favorites (<span id="favCount">0</span>)</button>
            <button class="theme-toggle" id="themeToggle" title="Toggle Theme">☀️</button>
        </div>
    </header>

    <main>
        <div class="stats-bar">
            <span id="gameCounter">Loading games...</span>
            <span>Click any game to launch offline instantly</span>
        </div>

        <div class="categories-filter" id="categoriesFilter">
            <button class="category-chip active" data-category="all">All Games</button>
            <button class="category-chip" data-category="cards">Cards & Casino</button>
            <button class="category-chip" data-category="slots">Slots & Dice</button>
            <button class="category-chip" data-category="sports">Sports & Pool</button>
            <button class="category-chip" data-category="action">Action & Rush</button>
            <button class="category-chip" data-category="puzzle">Puzzle & Words</button>
        </div>

        <div class="games-grid" id="gamesGrid"></div>
    </main>

    <footer>
        <p>&copy; 2026 Deepak IT & Web Services. Hosted on GitHub Pages.</p>
    </footer>

    <script>
        const rawFolders = [
            "3d_soccer_slot", "8_ball_pool_c2", "american_football_kicks", "arcade_golf", "atlantis", 
            "baccarat", "black_jack_diamond", "black_jack_gold", "black_jack_silver", "candies", 
            "captaincavern", "cartoons", "corona", "crazydoctors", "dartagnan", "davinci", 
            "devils_bikers", "dracula", "gladiator", "grizzly", "happy_christmas", "happy_farm", 
            "images", "indiana_croft", "jacks_or_better", "james_band", "joker_poker", "jules_verne", 
            "jungle_jimmy", "jurassic_world", "just_married", "lasvegas", "liberty_bell", "london", 
            "lucky_luke", "luna_park", "mafia_boss", "mah_jong", "marilyn", "mont_blanc", "navy", 
            "new_year_eve", "new_york", "numbers", "pantheon", "paris", "real_tennis", "red_dog", 
            "roulette_royale", "roulette_silver", "royal_fruit", "rue_commerce", "safari", 
            "sergent_pepper", "shinobi", "ski_rush", "small_life", "snake_attack", "soap_ball_craze_c2", 
            "space_runners", "speed_rush_c2", "super_heroes", "swing_jetpack", "tap_the_tile_c2", 
            "the_bandit_hunter_c2", "tokyo", "virus_attack", "word_finder", "world_cup", "zap_aliens", "zorro"
        ];

        let favorites = JSON.parse(localStorage.getItem('arcade_favorites')) || [];
        let currentCategory = 'all';
        let showOnlyFavs = false;

        function formatGameName(folder) {
            return folder
                .replace(/([A-Z])/g, ' $1')
                .replace(/[-_]/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase())
                .trim();
        }

        function getCategory(folder) {
            const f = folder.toLowerCase();
            if (f.includes('blackjack') || f.includes('baccarat') || f.includes('poker') || f.includes('mah_jong') || f.includes('cards')) return 'cards';
            if (f.includes('slot') || f.includes('roulette') || f.includes('fruit') || f.includes('bell') || f.includes('lasvegas')) return 'slots';
            if (f.includes('soccer') || f.includes('pool') || f.includes('football') || f.includes('golf') || f.includes('tennis') || f.includes('world_cup')) return 'sports';
            if (f.includes('rush') || f.includes('attack') || f.includes('hunter') || f.includes('runners') || f.includes('shinobi') || f.includes('heroes')) return 'action';
            if (f.includes('word') || f.includes('numbers') || f.includes('small_life')) return 'puzzle';
            return 'slots';
        }

        const games = rawFolders.map(folder => ({
            folder: folder,
            name: formatGameName(folder),
            category: getCategory(folder)
        }));

        const grid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const gameCounter = document.getElementById('gameCounter');
        const favCountSpan = document.getElementById('favCount');
        const favFilterBtn = document.getElementById('favFilterBtn');

        function renderGames() {
            const searchTerm = searchInput.value.toLowerCase().trim();
            
            let filtered = games.filter(game => {
                const matchesSearch = game.name.toLowerCase().includes(searchTerm) || game.folder.toLowerCase().includes(searchTerm);
                const matchesCategory = currentCategory === 'all' || game.category === currentCategory;
                const matchesFav = !showOnlyFavs || favorites.includes(game.folder);
                return matchesSearch && matchesCategory && matchesFav;
            });

            gameCounter.textContent = `Showing ${filtered.length} of ${games.length} games`;
            favCountSpan.textContent = favorites.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-results">No games found matching your criteria.</div>`;
                return;
            }

            grid.innerHTML = filtered.map(game => {
                const isFav = favorites.includes(game.folder);
                return `
                    <a href="./${game.folder}/index.html" class="game-card">
                        <div class="game-info">
                            <h3>${game.name}</h3>
                        </div>
                        <div class="game-meta">
                            <span class="game-badge">${game.category}</span>
                            <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${game.folder}')" title="Favorite">
                                ${isFav ? '⭐' : '☆'}
                            </button>
                        </div>
                    </a>
                `;
            }).join('');
        }

        window.toggleFavorite = function(e, folder) {
            e.preventDefault();
            e.stopPropagation();
            if (favorites.includes(folder)) {
                favorites = favorites.filter(f => f !== folder);
            } else {
                favorites.push(folder);
            }
            localStorage.setItem('arcade_favorites', JSON.stringify(favorites));
            renderGames();
        };

        searchInput.addEventListener('input', renderGames);

        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category;
                renderGames();
            });
        });

        favFilterBtn.addEventListener('click', () => {
            showOnlyFavs = !showOnlyFavs;
            favFilterBtn.style.background = showOnlyFavs ? 'var(--accent-color)' : 'var(--surface-hover)';
            favFilterBtn.style.color = showOnlyFavs ? '#fff' : 'var(--text-primary)';
            renderGames();
        });

        const themeToggle = document.getElementById('themeToggle');
        const body = document.body;

        themeToggle.addEventListener('click', () => {
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        renderGames();
    </script>
</body>
</html>
